<style>
:root{--bg:#f6efe5;--card:#fffbf5;--ink:#18121d;--mute:#7b7080;--line:#eadfce;--pur:#6a3fb5;--pur2:#efe8fb;--pink:#e0468b;--pink2:#fde8f1;--beige:#efe3d1;--g:linear-gradient(135deg,#6a3fb5,#e0468b);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;transition:transform .12s,filter .15s}button:active{transform:scale(.96)}.hidden{display:none!important}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}input:focus,textarea:focus{border-color:var(--pur);box-shadow:0 0 0 3px #6a3fb622}textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12px;font-weight:600;color:#5d5262;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 15px;font-weight:700;font-size:13px;background:var(--g);color:#fff;text-decoration:none;white-space:nowrap}
.btn.dark{background:var(--ink)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.soft{background:var(--pur2);color:var(--pur)}.btn.danger{background:#fff;color:#b3261e;border:1px solid #f0c9c6}.btn.sm{padding:9px 13px;font-size:12px}.btn:disabled{opacity:.5}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:#fcfcf8;padding:48px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:36px}.lockup{width:min(440px,100%);height:auto}
.flow div{display:flex;align-items:center;gap:12px;padding:11px 0;color:#4b4150;font-weight:600;position:relative}.flow b{width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}.flow div:not(:last-child)::after{content:"";position:absolute;left:11px;top:35px;height:22px;width:2px;background:#e4d9ea}
.formside{display:grid;place-items:center;padding:28px}.formbox{width:100%;max-width:380px}.formbox h2{font-size:26px;letter-spacing:-.5px;margin:0 0 6px}.formbox>p{color:var(--mute);margin:0 0 22px}.fg{display:grid;gap:12px}.formbox .btn{width:100%;padding:14px;margin-top:16px}.err{color:#b3261e;font-size:12px;margin-top:10px}
/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--ink);color:#b9aec1;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:19px;letter-spacing:-.3px;padding:2px 8px 18px}.logo i{width:32px;height:32px;border-radius:9px;background:#fff center/cover no-repeat}
#nav{display:contents}.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;font-weight:600;color:#b9aec1;position:relative}.nav:hover{background:#241c2b}.nav.on{background:#2c2236;color:#fff}.nav.on .i{stroke:#f08abc}.nav span{flex:1;text-align:left}
.nav em{font-style:normal;background:var(--pink);color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}.nav[data-v=me]{display:none}
.side h6{margin:16px 12px 4px;font-size:11px;color:#7d7185;font-weight:600}.ext{display:block;color:#b9aec1;text-decoration:none;padding:10px 12px;border-radius:12px;font-weight:600}.ext:hover{background:#241c2b;color:#fff}
.usr{margin-top:auto;display:flex;align-items:center;gap:10px;background:#241c2b;border-radius:14px;padding:10px;cursor:pointer}.usr b{display:block;color:#fff;font-size:13px}.usr span{font-size:11px;color:#8f8497}.usr button{margin-left:auto;color:#8f8497;font-size:12px;font-weight:600;white-space:nowrap}
.av3{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;background-size:cover;background-position:center}.r-dev{background-image:linear-gradient(135deg,#e0468b,#6a3fb5)}.r-md{background-image:linear-gradient(135deg,#18121d,#6a3fb5)}.av3.big{width:68px;height:68px;font-size:26px}
main{padding:26px clamp(16px,3vw,40px) 60px;max-width:880px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{font-size:24px;letter-spacing:-.5px;margin:0}.hi{color:var(--mute);font-weight:600;font-size:12px;display:block}.acts{display:flex;gap:10px;align-items:center}
.sync{font-size:11px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:6px}.sync i{width:8px;height:8px;border-radius:50%;background:#e0a526}.sync.ok i{background:#2fbf71}
/* summary + filters */
.sum{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;gap:16px;align-items:center;margin-bottom:14px}
.ring{width:76px;height:76px;flex:none;position:relative}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}.sum h2{margin:0 0 3px;font-size:16px}.sum p{margin:0;color:var(--mute);line-height:1.4}
.fl{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.fl::-webkit-scrollbar{display:none}.fc{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-weight:600;font-size:13px;color:#5d5262}.fc b{margin-left:4px;color:var(--mute)}.fc.on{background:var(--ink);color:#fff;border-color:var(--ink)}.fc.on b{color:#e6d6f3}
.gh{margin:18px 4px 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);display:flex;gap:8px;align-items:center}.gh b{background:var(--beige);border-radius:99px;padding:2px 8px;color:var(--ink);letter-spacing:0}
/* task card */
.task{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.th{display:flex;gap:12px}.tm{flex:1;min-width:0}.tm h3{margin:0 0 8px;font-size:16px;letter-spacing:-.2px;line-height:1.3}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid #d9cdbb;display:grid;place-items:center;flex:none;color:#fff}.tick .i{width:15px;height:15px;stroke-width:3}.tick.review{border-color:var(--pur);background:var(--pur2);color:var(--pur)}.tick.complete{border-color:var(--ink);background:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.ch{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#5d5262;background:var(--beige);border-radius:99px;padding:4px 10px}.ch .i{width:13px;height:13px}.ch.late{background:var(--pink2);color:var(--pink)}.ch.cal{background:var(--pur2);color:var(--pur)}
.b-pending{background:var(--pink2);color:var(--pink)}.b-review{background:var(--pur2);color:var(--pur)}.b-complete{background:var(--ink);color:#fff}
.steps{display:flex;gap:6px;margin-top:14px}.steps span{flex:1;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#b3a7b8;padding-top:8px;position:relative}.steps span::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:4px;background:var(--beige)}.steps span.on{color:var(--ink)}.steps span.on::before{background:var(--g)}
.kp{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px}.kp summary{list-style:none;padding:10px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer}.kp summary::-webkit-details-marker{display:none}.kp summary b{background:var(--pur2);color:var(--pur);border-radius:99px;padding:1px 8px;font-size:11px}.kp summary .i{margin-left:auto;transition:transform .2s}.kp[open] summary .i{transform:rotate(180deg)}.kp ul{margin:0;padding:0 14px 12px 30px;color:#4b4150;line-height:1.7}
.ft{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.ft .grow{flex:1;display:flex;gap:8px;flex-wrap:wrap}
.ib{position:relative;width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:#4b4150;text-decoration:none}.ib.del{color:#b3261e}.ib em{position:absolute;top:-6px;right:-6px;background:var(--pink);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:99px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.empty{background:var(--card);border:1.5px dashed #d9cdbb;border-radius:20px;padding:36px 20px;text-align:center;color:var(--mute)}.empty b{display:block;color:var(--ink);margin-bottom:4px}
.sk{height:150px;border-radius:20px;margin-bottom:12px;background:linear-gradient(90deg,#efe3d1 25%,#f8f1e7 50%,#efe3d1 75%);background-size:200% 100%;animation:sh 1.2s infinite}
/* chat */
.ms,.cml{display:flex;flex-direction:column;gap:12px}.cml{max-height:50vh;overflow:auto;margin:6px 0 14px}.cm{display:flex;gap:10px;align-items:flex-end;max-width:90%}.cm.me{flex-direction:row-reverse;margin-left:auto}
.bub{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:9px 12px;min-width:0}.cm.me .bub{background:var(--ink);color:#fff;border-color:var(--ink);border-radius:16px 16px 4px 16px}.bub b{font-size:11px;opacity:.65}.bub p{margin:2px 0 0;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}.bub span{display:block;font-size:10px;opacity:.5;margin-top:3px}
.chatv{display:flex;flex-direction:column;min-height:calc(100vh - 130px)}.chatv .ms{flex:1;justify-content:flex-end}.cf{position:sticky;bottom:0;display:flex;gap:8px;background:var(--bg);padding:12px 0 4px;margin-top:8px}.cf input{border-radius:99px;padding:13px 16px}.send{width:46px;height:46px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;flex:none}
/* modal */
.ov{position:fixed;inset:0;background:#18121d88;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .2s}.modal{background:var(--card);border-radius:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:22px}.modal h3{margin:0 0 4px;font-size:18px;letter-spacing:-.3px}.sub{color:var(--mute);margin:0 0 16px;font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.drop{display:block;border:2px dashed #cdbfd8;border-radius:16px;padding:28px 14px;text-align:center;cursor:pointer;background:#fff;margin:0}.drop b{display:block;font-size:15px;color:var(--ink)}.drop span{color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.nl{display:grid;gap:8px;max-height:60vh;overflow:auto}.ni{padding:11px 12px;border-radius:12px;background:var(--beige);line-height:1.45}.ni.new{background:var(--pur2)}.ni span{display:block;font-size:11px;color:var(--mute);margin-top:3px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;z-index:80;animation:up .25s}
/* motion */
@keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes fade{from{opacity:0}}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}}@keyframes sh{to{background-position:-200% 0}}@keyframes shake{20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}@keyframes sl{from{transform:translateY(100%)}}
.anim .task,.anim .sum,.anim .gh{animation:up .4s ease both;animation-delay:var(--d,0ms)}.anim .tick.review .i,.anim .tick.complete .i{animation:pop .4s .25s both}.shake{animation:shake .6s}.cm{animation:up .25s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){
body{font-size:15px}
#login{display:flex;flex-direction:column;background:#fcfcf8}.hero{padding:calc(26px + env(safe-area-inset-top)) 20px 14px}.flow{display:none}.lockup{width:min(300px,78%)}.formside{flex:1;background:#fff;box-shadow:0 -10px 30px #18121d14;border-radius:26px 26px 0 0;align-items:start;padding:26px 22px calc(28px + var(--sb))}
.app{display:block}
.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:30;flex-direction:row;justify-content:space-around;gap:0;padding:6px 6px calc(6px + var(--sb));background:var(--card);border-top:1px solid var(--line)}
.side .logo,.side h6,.ext,.usr{display:none}.nav[data-v=me]{display:flex}
.nav{flex:1;flex-direction:column;gap:3px;padding:6px 2px;font-size:11px;color:#9a8fa0;width:auto}.nav:hover{background:none}.nav.on{background:none;color:var(--pur)}.nav.on .i{stroke:var(--pur)}.nav .i{width:22px;height:22px}.nav span{flex:none}.nav em{position:absolute;top:0;left:calc(50% + 6px)}
main{padding:0 14px calc(100px + var(--sb));max-width:none}
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -14px 12px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px}.top h1{font-size:20px}.sync span{display:none}
#add{position:fixed;right:16px;bottom:calc(84px + var(--sb));z-index:25;border-radius:99px;padding:14px 20px;font-size:14px;box-shadow:0 8px 20px #6a3fb555}
.cf{bottom:calc(66px + var(--sb))}.chatv{min-height:calc(100dvh - 160px - var(--sb))}
.ov{align-items:flex-end;padding:0}.modal{max-width:none;max-height:92vh;border-radius:24px 24px 0 0;padding:12px 18px calc(22px + var(--sb));animation:sl .25s ease-out}.modal::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#d6cbc0;margin:0 auto 14px}
.toast{bottom:calc(92px + var(--sb))}}

$('view').onclick=e=>{const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;anim=true;return render()}const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.id)};
function act(a,id){const t=S.tasks.find(x=>x.id===id);if(!t)return;
 if(a==='share'){modal(`<h3>Upload video</h3><p class="sub">${esc(t.topic)}</p><form id="f" class="fg"><label class="drop" for="fl"><b>Tap to choose a video</b><span id="fn">From your phone or computer</span></label><input id="fl" type="file" accept="video/*" class="hidden"><div class="hidden" id="pg"><div style="height:8px;background:#efe3d1;border-radius:9px;overflow:hidden"><div id="pb" style="height:100%;width:0;background:var(--g);transition:width .3s"></div></div><p class="sub" id="pt2" style="margin:6px 0 0">Starting…</p></div><p class="sub" style="margin:0">It goes straight to the shared Drive folder and the link is saved for you. Keep this screen open until it finishes.</p><div class="foot"><button type="button" class="btn ghost" onclick="closeM()" id="cx">Cancel</button><button class="btn" id="go">Upload &amp; mark done</button></div></form>`);
  $('fl').onchange=()=>{const f=$('fl').files[0];$('fn').textContent=f?f.name+' · '+(f.size/1048576).toFixed(1)+' MB':'From your phone or computer'};
  $('f').onsubmit=async ev=>{ev.preventDefault();const f=$('fl').files[0];if(!f)return say('Choose a video first');if(!url&&!demo)return say('Google Sheet backend is not connected');
   $('go').disabled=true;$('cx').disabled=true;$('pg').classList.remove('hidden');let link;
   try{link=await uploadVideo(f,p=>{$('pb').style.width=Math.round(p*100)+'%';$('pt2').textContent='Uploading '+Math.round(p*100)+'%'})}catch(err){$('pt2').textContent='Upload failed: '+err.message+'. Try again.';$('go').disabled=false;$('cx').disabled=false;return}
   t.link=link;t.status='review';notify('dev',`Video uploaded for “${t.topic}”. Please review and approve.`);closeM();save();say('Uploaded and marked done')}}
 if(a==='approve'){t.status='complete';notify('md',`Approved: “${t.topic}”. You can send the next topic's video now.`);save();say('Approved')}
 if(a==='changes'){modal(`<h3>Request changes</h3><p class="sub">${esc(t.topic)}</p><form id="f" class="fg"><div><label>What should change?</label><textarea id="a1" required></textarea></div><div class="foot"><button type="button" class="btn ghost" onclick="closeM()">Cancel</button><button class="btn">Send</button></div></form>`);
  $('f').onsubmit=ev=>{ev.preventDefault();const r=$('a1').value.trim();t.status='pending';t.comments.push({by:me.name,role:me.role,text:'Changes requested: '+r,at:now()});notify('md',`Changes requested for “${t.topic}”: ${r}`);closeM();save()}}
 if(a==='del'&&confirm(`Delete “${t.topic}”?`)){S.tasks=S.tasks.filter(x=>x!==t);save()}
 if(a==='chat')cmts(id)}
function cmts(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;
 modal(`<h3>Comments</h3><p class="sub">${esc(t.topic)}</p><div class="cml">${t.comments.length?t.comments.map(c=>bub(c.role,c.by,c.text,c.at)).join(''):'<div class="empty" style="padding:22px">No comments yet. Write the first one.</div>'}</div><form id="f" class="fg"><textarea id="a1" required placeholder="${me.role==='md'?'Write a comment…':'Write your answer…'}"></textarea><div class="foot" style="margin-top:0"><button type="button" class="btn ghost" onclick="closeM()">Close</button><button class="btn">Send</button></div></form>`);
 const c=$('mount').querySelector('.cml');c.scrollTop=c.scrollHeight;
 $('f').onsubmit=e=>{e.preventDefault();const x=$('a1').value.trim();if(!x)return;t.comments.push({by:me.name,role:me.role,text:x,at:now()});notify(me.role==='dev'?'md':'dev',`${me.name} commented on “${t.topic}”: ${x.slice(0,80)}`);save();cmts(id)}}
$('add').onclick=()=>{modal(`<h3>New video topic</h3><p class="sub">MD Jahir Uddin will be notified to upload the video.</p><form id="f" class="fg"><div><label>Topic</label><input id="a1" required maxlength="140" placeholder="e.g. EB-3 process explained"></div><div class="two"><div><label>Videos needed</label><input id="a2" type="number" min="1" max="100" value="1"></div><div><label>Due date</label><input id="a3" type="date"></div></div><div><label>Key points (one per line)</label><textarea id="a4" placeholder="Point 1&#10;Point 2&#10;Point 3"></textarea></div><div class="foot"><button type="button" class="btn ghost" onclick="closeM()">Cancel</button><button class="btn">Add topic</button></div></form>`);
 $('f').onsubmit=e=>{e.preventDefault();const t={id:uid(),topic:$('a1').value.trim(),qty:Math.max(1,Math.min(100,+$('a2').value||1)),due:$('a3').value,notes:$('a4').value.trim(),status:'pending',link:'',created:now(),comments:[]};S.tasks.unshift(t);notify('md',`New topic: “${t.topic}” (${t.qty} video${t.qty>1?'s':''}). Please upload the video.`);closeM();save();say('Topic added')}};
/* ---- messages ---- */
function chatView(){const other=me.role==='dev'?'MD Jahir Uddin':'Meghla',L=S.msgs.length?S.msgs.map(m=>bub(m.role,m.by,m.text,fmt(m.ts))).join(''):`<div class="empty"><b>No messages yet</b>Say hello to ${other}.</div>`;
 if(!$('cf')){const v=$('view');v.className='chatv';v.innerHTML=`<div class="ms" id="ms">${L}</div><form id="cf" class="cf"><input id="ci" placeholder="Message ${esc(other)}…" autocomplete="off" maxlength="500"><button class="send" aria-label="Send">${ic('send')}</button></form>`;
  $('cf').onsubmit=e=>{e.preventDefault();const x=$('ci').value.trim();if(!x)return;$('ci').value='';sendMsg(x)};scrollTo(0,document.body.scrollHeight)}
 else{const m=$('ms'),near=innerHeight+scrollY>document.body.scrollHeight-160;m.innerHTML=L;if(near)scrollTo(0,document.body.scrollHeight)}}
async function sendMsg(text){const m={id:uid(),role:me.role,by:me.name,text,ts:Date.now()};S.msgs.push(m);if(!demo)SS('vf3',S);render();scrollTo(0,document.body.scrollHeight);
 if(!url)return;pend++;try{const d=await api({action:'sendMessage',msg:m});if(d.error==='auth')return out();if(d.rev)S.rev=d.rev;setSync('Synced',1)}catch(e){say('Message not sent. Check internet.');setSync('Offline')}finally{pend--}}
/* ---- alerts, profile ---- */
function alertsM(){const L=S.notices.filter(n=>n.to===me.role),s=seen[me.role+'n']||0;modal(`<h3>Alerts</h3><p class="sub">Latest updates for you</p><div class="nl">${L.length?L.map(n=>`<div class="ni ${n.ts>s?'new':''}">${esc(n.msg)}<span>${esc(n.time)}</span></div>`).join(''):'<div class="empty" style="padding:22px">You are all caught up.</div>'}</div><div class="foot"><button class="btn ghost" onclick="closeM()">Close</button></div>`);seen[me.role+'n']=Date.now();SS('vf3seen',seen);render()}
function profile(force){let ph=me.photo||'';lockM=!!force;const live=url&&!demo;
 modal(`<h3>${force?'Set a new password':'Profile'}</h3><p class="sub">${force?'This account still uses the starting password. Choose your own to continue.':me.role==='dev'?'Developer account':'MD account'}</p><form id="f" class="fg"><div style="display:flex;align-items:center;gap:14px"><span class="av3 big r-${me.role}" id="pav"></span><label class="btn sm ghost" for="pfile" style="margin:0;cursor:pointer">Change photo</label><input id="pfile" type="file" accept="image/*" class="hidden"></div><div><label>Your name</label><input id="pn" value="${esc(me.name)}" maxlength="40" required></div>${live?`<details ${force?'open':''}><summary style="cursor:pointer;font-weight:600">Change password</summary><div class="fg" style="margin-top:10px"><input id="po" type="password" placeholder="Current password" autocomplete="current-password"><input id="pw1" type="password" placeholder="New password (at least 4 characters)" autocomplete="new-password"></div></details>`:''}<div class="foot" style="justify-content:space-between"><button type="button" class="btn danger" id="plo">Log out</button><span style="display:flex;gap:8px">${force?'':'<button type="button" class="btn ghost" onclick="closeM()">Cancel</button>'}<button class="btn" id="psv">Save</button></span></div></form>`);
 const pv=()=>{const e=$('pav');e.style.backgroundImage=ph?`url("${ph}")`:'';e.textContent=ph?'':me.name[0].toUpperCase()};pv();
 $('pfile').onchange=()=>{const f=$('pfile').files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=160,m=Math.min(im.width,im.height);c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);ph=c.toDataURL('image/jpeg',.8);pv()};im.onerror=()=>say('Could not read that image');im.src=URL.createObjectURL(f)};
 $('plo').onclick=()=>{closeM();out()};
 $('f').onsubmit=async ev=>{ev.preventDefault();const nm=$('pn').value.trim()||me.name,o=$('po')?$('po').value:'',n=$('pw1')?$('pw1').value:'';
  if(force&&!n)return say('Set a new password to continue');if(n&&n.length<4)return say('New password needs at least 4 characters');if(n&&!o)return say('Enter your current password');
  if(live){$('psv').disabled=true;try{const d=await api({action:'profile',name:nm,photo:ph,oldPassword:o,newPassword:n});if(!d.ok){say(d.error==='auth'?'Please log in again':d.error||'Could not save');if(d.error==='auth')out();else $('psv').disabled=false;return}}catch(e2){say('Cannot reach Google Sheet');$('psv').disabled=false;return}}
  me={...me,name:nm,photo:ph,weak:n?false:me.weak};S.people[me.role]={name:nm,photo:ph};if(!demo)SS('vf3sess',{me,token});closeM();paintMe();render();say(n?'Profile and password updated':'Profile updated')}}
/* ---- upload straight to Drive (resumable) ---- */
function putChunk(u,blob,a,b,tot){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('PUT',u);x.onload=()=>{if(x.status===308)ok(null);else if(x.status<300){let j=null;try{j=JSON.parse(x.responseText)}catch(e){}ok(j)}else no(new Error('Drive error '+x.status))};x.onerror=()=>no(new Error('network error'));x.setRequestHeader('Content-Range',`bytes ${a}-${b-1}/${tot}`);x.send(blob)})}
async function uploadVideo(file,onp){const name=Date.now()+'_'+file.name.replace(/[^\w.\- ]/g,'_');
 const r=await api({action:'startUpload',name,mime:file.type||'video/mp4',size:file.size,origin:location.origin});if(!r.ok)throw new Error(r.error||'could not start');
 const CH=5*1024*1024;let pos=0,res=null;while(pos<file.size){const end=Math.min(pos+CH,file.size);res=await putChunk(r.uploadUrl,file.slice(pos,end),pos,end,file.size)||res;pos=end;onp(pos/file.size)}
 const d=await api({action:'finishUpload',name,id:res&&res.id||''});if(!d.ok)throw new Error(d.error||'could not finish');return d.link}
/* ---- modal ---- */
function modal(h){$('mount').innerHTML=`<div class="ov"><div class="modal">${h}</div></div>`;$('mount').firstChild.onclick=e=>{if(e.target.classList.contains('ov')&&!lockM)closeM()};const f=$('mount').querySelector('input:not([type=file]),textarea');if(f&&!/Mobi|Android/i.test(navigator.userAgent))f.focus()}
function closeM(){lockM=false;$('mount').innerHTML=''}
/* ---- live updates ---- */
setInterval(async()=>{if(!me||document.hidden||pend)return;const a=unM(),b=unN();await pull();const a2=unM(),b2=unN();
 if(a2>a||b2>b){const t=a2>a?'New message':'New update';say(t);if(window.Notification&&Notification.permission==='granted')new Notification('ContentBridge',{body:t});if(b2>b){const e=document.querySelector('[data-v=alerts] .i');if(e){e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),700)}}}},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
const sess=LS('vf3sess');if(sess&&sess.me){me=sess.me;enter()}
</script></body></html>
